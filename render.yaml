## render.yaml — Nobatic production infrastructure
##
## Render reads this file when you connect the repo via
## "New > Blueprint" in the Render dashboard.
##
## Services defined here:
##   1. nobatic-api      — Django / Gunicorn web service
##   2. nobatic-worker   — Celery background worker
##   3. nobatic-frontend — React static site
##   4. nobatic-db       — Managed PostgreSQL (created once, never recreated)
##   5. nobatic-redis    — Managed Redis

databases:
  - name: nobatic-db
    databaseName: nobatic
    user: nobatic
    plan: free            # upgrade to starter ($7/mo) before production traffic
    region: frankfurt

services:
  # ── 1. Django API ────────────────────────────────────────────────────────────
  - type: web
    name: nobatic-api
    runtime: python
    plan: free            # upgrade to starter ($7/mo) before production traffic
    region: frankfurt     # closest to Iran; change to singapore if latency matters more
    rootDir: backend
    buildCommand: pip install -r requirements/base.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "False"
      - key: DEBUG_OTP
        value: "False"
      - key: SECRET_KEY
        generateValue: true        # Render generates a random value on first deploy
      - key: ALLOWED_HOSTS
        value: nobatic-api.onrender.com    # update after adding custom domain
      - key: CORS_ALLOWED_ORIGINS
        value: https://nobatic-frontend.onrender.com   # update after adding custom domain
      - key: FRONTEND_BASE_URL
        value: https://nobatic-frontend.onrender.com   # update after adding custom domain
      - key: DATABASE_URL
        fromDatabase:
          name: nobatic-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nobatic-redis
          type: redis
          property: connectionString
      - key: CSRF_TRUSTED_ORIGINS
        value: https://nobatic-frontend.onrender.com,https://nobatic-api.onrender.com
      - key: ZARINPAL_MERCHANT_ID
        sync: false       # set manually in Render dashboard — never commit secrets
      - key: ZARINPAL_SANDBOX
        value: "True"     # flip to False only after testing with real credentials
      - key: ZARINPAL_CALLBACK_BASE_URL
        value: https://nobatic-api.onrender.com    # update after adding custom domain
      - key: KAVENEGAR_API_KEY
        sync: false       # set manually in Render dashboard
      - key: SENTRY_DSN
        sync: false       # optional; set manually if you have a Sentry project

  # ── 3. React Frontend ────────────────────────────────────────────────────────
  - type: web
    name: nobatic-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html    # SPA fallback — all routes served by React Router
    envVars:
      - key: NODE_VERSION
        value: "20.19.2"
      - key: VITE_API_BASE_URL
        value: https://nobatic-api.onrender.com    # update after adding custom domain

  # ── 5. Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: nobatic-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
