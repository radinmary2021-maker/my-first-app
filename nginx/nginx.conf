upstream backend {
    server backend:8000;
    keepalive 32;
}

# ── Rate limiting ─────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=otp_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=60r/m;
limit_req_status 429;

# ── Gzip ──────────────────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# ── HTTP (ArvanCloud CDN terminates SSL) ──────────────────────────────────────
server {
    listen 80;
    server_name nobatiic.ir www.nobatiic.ir;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "DENY"                                          always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-XSS-Protection          "1; mode=block"                                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"      always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none';" always;

    client_max_body_size 10M;

    # ── Proxy defaults ────────────────────────────────────────────────────────
    proxy_http_version      1.1;
    proxy_set_header        Connection        "";
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout   10s;
    proxy_send_timeout      60s;
    proxy_read_timeout      60s;

    # ── OTP endpoint — tight rate limit ──────────────────────────────────────
    location = /api/auth/send-otp/ {
        limit_req zone=otp_zone burst=3 nodelay;
        proxy_pass http://backend;
    }

    # ── API → Django ──────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://backend;
    }

    # ── Admin → Django ────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://backend;
    }

    # ── Health check (no logging, no rate limit) ──────────────────────────────
    location /health/ {
        proxy_pass http://backend;
        access_log off;
    }

    # ── Django static files ───────────────────────────────────────────────────
    location /static/ {
        alias   /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── User-uploaded media ───────────────────────────────────────────────────
    location /media/ {
        alias   /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── React SPA fallback ────────────────────────────────────────────────────
    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
