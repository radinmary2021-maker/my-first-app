upstream backend {
    server backend:8000;
    keepalive 32;
}

# ── Rate limiting ─────────────────────────────────────────────────────────────
# Keyed by client IP. Limits the OTP send endpoint at the network edge,
# complementing the Redis-backed rate limiting in Django.
limit_req_zone $binary_remote_addr zone=otp_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=60r/m;
limit_req_status 429;

# ── Gzip ──────────────────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ── SSL ───────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-XSS-Protection          "1; mode=block"                                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"      always;
    # Content-Security-Policy: tightened once you know all external sources.
    # 'unsafe-inline' is required by some Tailwind/Vite setups; remove when possible.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none';" always;

    client_max_body_size 10M;

    # ── Proxy defaults ────────────────────────────────────────────────────────
    proxy_http_version      1.1;
    proxy_set_header        Connection        "";
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_connect_timeout   10s;
    proxy_send_timeout      60s;
    proxy_read_timeout      60s;

    # ── OTP endpoint — tight rate limit ──────────────────────────────────────
    location = /api/auth/send-otp/ {
        limit_req zone=otp_zone burst=3 nodelay;
        proxy_pass http://backend;
    }

    # ── API → Django ──────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://backend;
    }

    # ── Admin → Django ────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://backend;
    }

    # ── Health check (no logging, no rate limit) ──────────────────────────────
    location /health/ {
        proxy_pass http://backend;
        access_log off;
    }

    # ── Django static files ───────────────────────────────────────────────────
    location /static/ {
        alias   /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── User-uploaded media ───────────────────────────────────────────────────
    location /media/ {
        alias   /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── React SPA fallback ────────────────────────────────────────────────────
    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
